services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manageria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manageria}
      POSTGRES_DB: ${POSTGRES_DB:-manageria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volumes get SELinux labels automatically; bind mounts would need :Z on Fedora.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manageria} -d ${POSTGRES_DB:-manageria}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: